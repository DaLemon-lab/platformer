<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Hollow Cup – Boss Rush</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#04070a}
body{display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,calc(100vh*16/9));height:auto;aspect-ratio:16/9;cursor:crosshair;display:block}
</style></head><body><canvas id="c" width="960" height="540"></canvas>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),W=960,H=540,FY=480,P2=Math.PI*2;
const PL=[{x:120,y:370,w:180},{x:660,y:370,w:180},{x:390,y:260,w:180}];
const K={},M={x:480,y:200,d:false};
const B=[['Gloop the Gelatinous','#7fd18a',0,2,['aim','ring']],['Baron Bolt','#f2c94c',6,2,['aim','rain','charge']],['Madam Moth','#c9a7e8',0,3,['wave','homing']],['Sir Spikewick','#e8836b',12,1,['charge','ring','slam']],['Captain Barnacle','#5fb3c9',8,2,['rain','aim','spiral']],['Dr. Cogsworth','#c8a46a',10,1,['spiral','slam','aim']],['The Lantern King','#ffd36e',0,1,['homing','ring','wave']],['Hornet Matron','#d9534f',5,2,['charge','aim','homing']],['Granny Grimm','#b8b8c8',0,2,['wave','spiral','rain']],['Mr. Mushroom','#e07fb0',9,3,['ring','slam','rain']],['Stormcloud Stan','#8fa9c9',0,2,['rain','wave','homing','aim']],['Count Cobweb','#a2a2a2',8,3,['spiral','charge','homing']],['Big Bad Bun','#f0e0d0',0,2,['slam','aim','charge']],['Lord Lava','#ff7a3d',14,2,['ring','rain','slam','spiral']],['Sister Sorrow','#6f7fd6',0,1,['homing','wave','spiral']],['The Clockwork Crow','#6a6a80',6,1,['charge','aim','ring','wave']],['Tidal Tom','#3fb0a0',0,3,['wave','rain','slam','homing']],['Frosty Fang','#bfe8ff',12,2,['spiral','charge','ring','aim']],['King Crimson Crab','#c0392b',10,2,['slam','wave','homing','rain']],['The Hollow Sun','#ffe9a0',16,1,['spiral','ring','slam','homing','wave','charge']]];
const CH=[['Frog','LMB: shoot your tongue where you aim.','It sticks to anything and reels you in.','Jump while pulling to launch!'],['Mace Knight','LMB: slam-dash toward your mouse.','Mace damage = your speed.','Dive from high up for huge hits.'],['Gunslinger','Hold LMB: shoot where you aim.','Fast fire, low damage per bullet.','Stay mobile and keep distance.']];
let S='menu',bi=0,maxBi=0,ch=0,tm=0,shake=0,p,boss,bl=[],pb=[],pt=[],tx=[],T=0,ash=[];
for(let i=0;i<50;i++)ash.push({x:Math.random()*W,y:Math.random()*H,s:8+Math.random()*20,r:Math.random()*1.6+.4});
function mpos(e){const r=c.getBoundingClientRect();M.x=(e.clientX-r.left)*W/r.width;M.y=(e.clientY-r.top)*H/r.height}
c.addEventListener('mousemove',mpos);
c.addEventListener('mousedown',e=>{mpos(e);if(e.button==0){M.d=true;onClick()}});
addEventListener('mouseup',()=>{M.d=false});
c.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{K[e.code]=1;if(e.code=='Space'||e.code.startsWith('Arrow'))e.preventDefault();
 if(S=='menu'){if(e.code=='Digit1')start(0);if(e.code=='Digit2')start(1);if(e.code=='Digit3')start(2);if(e.code=='KeyQ')bi=Math.max(0,bi-1);if(e.code=='KeyE')bi=Math.min(maxBi,bi+1)}});
addEventListener('keyup',e=>K[e.code]=0);
function start(i){ch=i;p={x:468,y:FY-38,vx:0,vy:0,hp:5,inv:0,cd:0,dash:0,coy:0,f:1,gr:true,tg:null};
 const d=B[bi],mx=80+bi*16;boss={n:d[0],col:d[1],spk:d[2],eyes:d[3],pats:d[4],pi:0,max:mx,hp:mx,r:46+(bi%5)*5,x:480,y:150,t:0,intro:2.2,cool:1.2,act:null,hit:0,iv:0,ph:1,tx:480,ty:150,free:false,sp:1};
 bl=[];pb=[];tx=[];S='fight';tm=0}
function onClick(){
 if(S=='menu'){for(let i=0;i<3;i++){const x=65+i*290;if(M.x>x&&M.x<x+260&&M.y>170&&M.y<420)start(i)}}
 else if(S=='dead'&&tm>.6)S='menu';
 else if(S=='victory'&&tm>1){bi=0;S='menu'}
 else if(S=='fight'&&boss.intro<=0){const cx=p.x+12,cy=p.y+19,a=Math.atan2(M.y-cy,M.x-cx);
  if(ch==0&&!p.tg&&p.cd<=0)p.tg={s:0,l:0,dx:Math.cos(a),dy:Math.sin(a),ax:0,ay:0,bo:0,ox:0,oy:0,t:0};
  if(ch==1&&p.cd<=0){p.dash=.28;p.cd=.8;p.vx=Math.cos(a)*1150;p.vy=Math.sin(a)*1150}}}
const shot=(x,y,a,s,o)=>bl.push(Object.assign({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:9,life:7},o||{}));
function burst(x,y,col,n,s){for(let i=0;i<n;i++){const a=Math.random()*P2,v=Math.random()*s;pt.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.6+Math.random()*.5,c:col})}}
function hurt(){if(p.inv>0||p.dash>0||S!='fight')return;p.hp--;p.inv=1.3;p.vy=-380;shake=8;burst(p.x+12,p.y+19,'#e8e4d8',14,260);if(p.hp<=0){S='dead';tm=0}}
function dmgB(d,x,y){const b=boss;if(b.intro>0)return;b.hp-=d;b.hit=.08;burst(x,y,'#fff',4,200);
 if(d>=3)tx.push({x:b.x,y:b.y-b.r-10,t:1,s:Math.round(d)});
 if(b.ph==1&&b.hp<b.max/2){b.ph=2;shake=14;b.sp=1.25}
 if(b.hp<=0&&S=='fight'){S='ko';tm=0;bl=[];burst(b.x,b.y,b.col,80,500)}}
function endAct(){const b=boss;b.act=null;b.cool=Math.max(.5,1.5-bi*.04)/(b.ph==2?1.4:1)}
function aimA(){return Math.atan2(p.y+19-boss.y,p.x+12-boss.x)}
function actUpd(dt){const b=boss,a=b.act,sp=b.sp*(1+bi*.03);a.tm=(a.tm||0)+dt;a.k=a.k||0;
 switch(a.t){
 case'aim':{const n=3+b.ph;if(a.k<n&&a.tm>.3+a.k*.3){shot(b.x,b.y,aimA(),340*sp);a.k++}if(a.tm>n*.3+1)endAct();break}
 case'ring':{if(!a.k&&a.tm>.5){a.k=1;const n=10+b.ph*4,o=Math.random()*6;for(let i=0;i<n;i++)shot(b.x,b.y,o+i*P2/n,230*sp)}if(a.tm>1.5)endAct();break}
 case'rain':{if(a.tm<2.6&&a.tm>a.k*.15){a.k++;shot(30+Math.random()*900,-10,Math.PI/2,260*sp,{r:10})}if(a.tm>3.2)endAct();break}
 case'spiral':{if(a.tm<2.6&&a.tm>a.k*.07){shot(b.x,b.y,a.k*.45,250*sp);a.k++}if(a.tm>3.2)endAct();break}
 case'wave':{if(a.k<2&&a.tm>.4+a.k*1.2){a.k++;const gap=130+Math.random()*280,r=Math.random()<.5;for(let y=50;y<FY;y+=42)if(Math.abs(y-gap)>75)shot(r?W+10:-10,y,r?Math.PI:0,240*sp,{r:11,life:6})}if(a.tm>3)endAct();break}
 case'homing':{if(!a.k&&a.tm>.4){a.k=1;for(let i=0;i<2+b.ph;i++)shot(b.x,b.y,aimA()+(i-1)*.9,170,{r:13,hom:1,life:5})}if(a.tm>1.4)endAct();break}
 case'charge':{b.free=true;
  if(!a.s){if(a.dir==null)a.dir=p.x<480?-1:1;b.x+=(a.dir>0?-1:1)*0;const tx_=a.dir<0?890:70,ty=FY-b.r;b.x+=(tx_-b.x)*Math.min(1,6*dt);b.y+=(ty-b.y)*Math.min(1,6*dt);if(Math.abs(b.x-tx_)<25&&Math.abs(b.y-ty)<25||a.tm>1.5){a.s=1;a.tm=0;a.dir=b.x>480?-1:1}}
  else if(a.s==1){b.x+=Math.sin(T*90)*2;if(a.tm>.5)a.s=2}
  else{b.x+=a.dir*680*sp*dt;if(b.x<40||b.x>920)endAct()}break}
 case'slam':{b.free=true;
  if(!a.s){b.x+=(p.x-b.x)*Math.min(1,5*dt);b.y+=(70-b.y)*Math.min(1,6*dt);if(a.tm>1){a.s=1;a.tm=0}}
  else if(a.s==1){if(a.tm>.35)a.s=2}
  else if(a.s==2){b.y+=1300*dt;if(b.y>=FY-b.r){b.y=FY-b.r;a.s=3;a.tm=0;shake=14;for(const s of[-1,1])shot(b.x,FY-14,s>0?0:Math.PI,300*sp,{r:14,life:3})}}
  else if(a.tm>.6)endAct();break}}}
function upd(dt){
 const b=boss;T+=dt;const cx=p.x+12,cy=p.y+19,ang=Math.atan2(M.y-cy,M.x-cx),ca=Math.cos(ang),sa=Math.sin(ang);
 p.f=M.x>cx?1:-1;p.inv-=dt;p.cd-=dt;p.dash-=dt;b.iv-=dt;b.hit-=dt;
 const dashing=p.dash>0,pull=p.tg&&p.tg.s==1,dir=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0),jmp=K.Space||K.KeyW||K.ArrowUp;
 if(!dashing){p.vy=Math.min(p.vy+1900*dt,1500);if(!pull)p.vx+=(dir*300-p.vx)*Math.min(1,(p.gr?16:5)*dt)}
 if(jmp&&p.coy>0&&!pull){p.vy=-700;p.coy=0}
 // frog tongue
 if(p.tg){const t=p.tg;t.t+=dt;
  if(t.s==0){const step=1500*dt,n=Math.ceil(step/8);let hit=0;
   for(let i=0;i<n&&!hit;i++){t.l+=step/n;const ex=cx+t.dx*t.l,ey=cy+t.dy*t.l;
    if(Math.hypot(ex-b.x,ey-b.y)<b.r){hit=2;t.bo=1;t.ox=ex-b.x;t.oy=ey-b.y;dmgB(6,ex,ey)}
    else if(ey>=FY||ey<0||ex<0||ex>W||PL.some(q=>ex>q.x&&ex<q.x+q.w&&ey>q.y&&ey<q.y+16))hit=1;
    if(hit){t.s=1;t.ax=ex;t.ay=ey;t.t=0}}
   if(!hit&&t.l>430)t.s=2}
  else if(t.s==1){if(t.bo){t.ax=b.x+t.ox;t.ay=b.y+t.oy}const dx=t.ax-cx,dy=t.ay-cy,d=Math.hypot(dx,dy)||1;
   p.vx=dx/d*850;p.vy=dy/d*850;
   if(d<28||t.t>1.6||(t.bo&&d<b.r+24)){if(t.bo&&b.iv<=0&&d<b.r+30){b.iv=.4;dmgB(3,b.x,b.y)}p.tg=null;p.cd=.12;p.vx*=.4;p.vy=-300}
   else if(jmp&&t.t>.1){p.tg=null;p.cd=.12;p.vy=-760;p.vx*=.8}}
  else{t.l-=2400*dt;if(t.l<=0){p.tg=null;p.cd=.1}}}
 // gun
 if(ch==2&&M.d&&p.cd<=0&&b.intro<=0){p.cd=.11;const j=(Math.random()-.5)*.06,a=ang+j;pb.push({x:cx+ca*26,y:cy+sa*26,vx:Math.cos(a)*950,vy:Math.sin(a)*950})}
 // move/collide
 p.x+=p.vx*dt;if(p.x<0){p.x=0;p.vx=0}if(p.x>W-24){p.x=W-24;p.vx=0}
 const py=p.y+38;p.y+=p.vy*dt;if(p.y<0){p.y=0;if(p.vy<0)p.vy=0}
 p.gr=false;
 if(p.vy>=0){if(p.y+38>=FY){p.y=FY-38;p.vy=0;p.gr=true}else for(const q of PL)if(p.x+24>q.x&&p.x<q.x+q.w&&py<=q.y+2&&p.y+38>=q.y){p.y=q.y-38;p.vy=0;p.gr=true}}
 p.coy=p.gr?.1:p.coy-dt;
 // mace
 if(ch==1){const sp=Math.hypot(p.vx,p.vy),da=dashing?Math.atan2(p.vy,p.vx):ang,hx=p.x+12+Math.cos(da)*46,hy=p.y+19+Math.sin(da)*46;
  if(sp>350&&b.iv<=0&&b.intro<=0&&Math.hypot(hx-b.x,hy-b.y)<b.r+20){b.iv=.4;const d=sp/110;dmgB(d,hx,hy);shake=Math.min(20,d*1.6);p.vx=-p.vx*.35;p.vy=-320;p.dash=0;burst(hx,hy,'#ffd36e',16,360)}}
 // boss
 b.t+=dt;b.free=false;
 if(b.intro>0){b.intro-=dt}
 b.tx=480+Math.sin(b.t*.9*b.sp)*260;b.ty=165+Math.sin(b.t*1.6)*30;
 if(b.intro<=0){if(b.act)actUpd(dt);else{b.cool-=dt;if(b.cool<=0)b.act={t:b.pats[b.pi++%b.pats.length]}}}
 if(!b.free){b.x+=(b.tx-b.x)*Math.min(1,3*dt);b.y+=(b.ty-b.y)*Math.min(1,3*dt)}
 if(b.intro<=0&&Math.hypot(cx-b.x,cy-b.y)<b.r+10)hurt();
 // bullets
 for(const o of bl){if(o.hom){const a=Math.atan2(p.y+19-o.y,p.x+12-o.x),sp=Math.hypot(o.vx,o.vy);let ca2=Math.atan2(o.vy,o.vx),df=a-ca2;df=Math.atan2(Math.sin(df),Math.cos(df));ca2+=df*Math.min(1,1.6*dt);o.vx=Math.cos(ca2)*sp;o.vy=Math.sin(ca2)*sp}
  o.x+=o.vx*dt;o.y+=o.vy*dt;o.life-=dt;if(Math.hypot(o.x-cx,o.y-cy)<o.r+11){o.life=0;hurt()}}
 bl=bl.filter(o=>o.life>0&&o.x>-40&&o.x<W+40&&o.y>-40&&o.y<H+40);
 for(const o of pb){o.x+=o.vx*dt;o.y+=o.vy*dt;if(Math.hypot(o.x-b.x,o.y-b.y)<b.r){o.dead=1;dmgB(1.3,o.x,o.y)}}
 pb=pb.filter(o=>!o.dead&&o.x>-20&&o.x<W+20&&o.y>-20&&o.y<H+20);}
function drawChar(cx,cy,i,f){
 g.lineWidth=2;g.strokeStyle='#e8e4d8';g.fillStyle='#0b0b10';g.beginPath();g.ellipse(cx,cy+8,11,15,0,0,P2);g.fill();g.stroke();
 g.fillStyle=['#cdebc2','#f2efe4','#efe2bd'][i];
 if(i==0)for(const s of[-1,1]){g.beginPath();g.arc(cx+s*7,cy-19,5.5,0,P2);g.fill();g.stroke()}
 if(i==1){g.lineWidth=3;g.beginPath();for(const s of[-1,1]){g.moveTo(cx+s*6,cy-17);g.quadraticCurveTo(cx+s*17,cy-22,cx+s*14,cy-36)}g.stroke();g.lineWidth=2}
 g.beginPath();g.arc(cx,cy-9,12,0,P2);g.fill();g.stroke();
 g.fillStyle='#000';g.beginPath();g.ellipse(cx-4.5+f*1.5,cy-9,2.8,4.5,0,0,P2);g.ellipse(cx+4.5+f*1.5,cy-9,2.8,4.5,0,0,P2);g.fill();
 if(i==0){g.beginPath();g.arc(cx+f*1.5,cy-3,6,.2,Math.PI-.2);g.stroke();for(const s of[-1,1]){g.beginPath();g.arc(cx+s*7+f,cy-19,2,0,P2);g.fill()}}
 if(i==2){g.fillStyle='#15151a';g.fillRect(cx-16,cy-22,32,4);g.fillRect(cx-9,cy-35,18,13);g.strokeRect(cx-9,cy-35,18,13)}}
function drawP(){const cx=p.x+12,cy=p.y+19,ang=Math.atan2(M.y-cy,M.x-cx),ca=Math.cos(ang),sa=Math.sin(ang);
 g.save();if(p.inv>0&&Math.floor(p.inv*20)%2)g.globalAlpha=.35;
 if(ch==2){g.strokeStyle='#e8e4d8';g.lineWidth=8;g.lineCap='round';g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+ca*26,cy+sa*26);g.stroke();g.strokeStyle='#15151a';g.lineWidth=4;g.stroke()}
 if(ch==1){const da=p.dash>0?Math.atan2(p.vy,p.vx):ang,hx=cx+Math.cos(da)*46,hy=cy+Math.sin(da)*46;
  g.strokeStyle='#e8e4d8';g.lineWidth=3;g.beginPath();g.moveTo(cx,cy);g.lineTo(hx,hy);g.stroke();
  g.fillStyle='#15151a';g.lineWidth=2.5;g.beginPath();g.arc(hx,hy,15,0,P2);g.fill();g.stroke();
  for(let i=0;i<6;i++){const a=i*P2/6+T*2;g.beginPath();g.moveTo(hx+Math.cos(a)*14,hy+Math.sin(a)*14);g.lineTo(hx+Math.cos(a)*21,hy+Math.sin(a)*21);g.stroke()}}
 if(p.tg){const t=p.tg,tipx=t.s==1?t.ax:cx+t.dx*t.l,tipy=t.s==1?t.ay:cy+t.dy*t.l;
  g.lineCap='round';g.strokeStyle='#e86a8a';g.lineWidth=6;g.beginPath();g.moveTo(cx,cy-3);g.lineTo(tipx,tipy);g.stroke();g.fillStyle='#ff9ab4';g.beginPath();g.arc(tipx,tipy,7,0,P2);g.fill()}
 drawChar(cx,cy,ch,p.f);g.restore()}
function drawB(){const b=boss,r=b.r,pull=b.act&&b.act.t=='charge'&&b.act.s==1;
 g.save();g.translate(b.x,b.y);g.lineJoin='round';g.strokeStyle='#1a0f08';g.lineWidth=6;
 const rot=T*.4;
 if(b.spk){g.fillStyle=b.col;for(let i=0;i<b.spk;i++){const a=rot+i*P2/b.spk;g.beginPath();g.moveTo(Math.cos(a-.14)*r*.9,Math.sin(a-.14)*r*.9);g.lineTo(Math.cos(a)*(r+20),Math.sin(a)*(r+20));g.lineTo(Math.cos(a+.14)*r*.9,Math.sin(a+.14)*r*.9);g.closePath();g.fill();g.stroke()}}
 g.fillStyle=b.col;g.beginPath();g.arc(0,0,r,0,P2);g.fill();g.stroke();
 g.fillStyle='rgba(255,255,255,.28)';g.beginPath();g.ellipse(-r*.3,-r*.4,r*.35,r*.2,-.5,0,P2);g.fill();
 const n=b.eyes,er=n==1?20:13,pa=Math.atan2(p.y-b.y,p.x-b.x);
 for(let i=0;i<n;i++){const ex=(i-(n-1)/2)*(er*2.3),ey=-r*.2;g.fillStyle='#fffbe8';g.lineWidth=4;g.beginPath();g.arc(ex,ey,er,0,P2);g.fill();g.stroke();
  g.fillStyle='#000';g.beginPath();g.ellipse(ex+Math.cos(pa)*er*.4,ey+Math.sin(pa)*er*.4,er*.35,er*.5,0,0,P2);g.fill();
  if(b.ph==2){g.lineWidth=5;g.beginPath();g.moveTo(ex-er-2,ey-er+(i%2?-2:6));g.lineTo(ex+er+2,ey-er+(i%2?6:-2));g.stroke()}}
 g.lineWidth=4;g.fillStyle='#2a0d0d';const open=b.act?r*.3:r*.12;g.beginPath();g.ellipse(0,r*.42,r*.38,open,0,0,Math.PI);g.fill();g.stroke();
 g.fillStyle='#fffbe8';for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(i*r*.14-5,r*.42);g.lineTo(i*r*.14+5,r*.42);g.lineTo(i*r*.14,r*.42+open*.6);g.fill()}
 if(b.ph==2){g.fillStyle='rgba(255,40,0,.15)';g.beginPath();g.arc(0,0,r,0,P2);g.fill()}
 if(b.hit>0){g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.arc(0,0,r,0,P2);g.fill()}
 g.restore()}
function tt(s,x,y,sz,col,al){g.font='bold '+sz+'px Georgia,serif';g.textAlign=al||'center';g.lineJoin='round';g.lineWidth=sz/5;g.strokeStyle='#000';g.strokeText(s,x,y);g.fillStyle=col||'#f3ead2';g.fillText(s,x,y)}
function bg(){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#10222c');gr.addColorStop(1,'#04070a');g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.fillStyle='#0b161d';for(let i=0;i<10;i++){const x=i*110+10,h=70+((i*53)%90);g.beginPath();g.moveTo(x-28,0);g.lineTo(x+10,h);g.lineTo(x+48,0);g.fill();const h2=120+((i*37)%110);g.beginPath();g.moveTo(x-40,FY);g.lineTo(x+20,FY-h2);g.lineTo(x+80,FY);g.fill()}
 for(let i=0;i<4;i++){const x=(i*300+T*12*(i+1))%1300-200,y=330+i*40;const rg=g.createRadialGradient(x,y,0,x,y,260);rg.addColorStop(0,'rgba(150,190,210,.07)');rg.addColorStop(1,'rgba(150,190,210,0)');g.fillStyle=rg;g.fillRect(x-260,y-260,520,520)}
